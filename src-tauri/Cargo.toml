[package]
name = "abergin"
version = "0.2.1"
description = "A stylish, native-feeling terminal for Windows"
authors = ["abergin"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "abergin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
anyhow = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
