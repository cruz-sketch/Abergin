<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abergin</title>
  </head>
  <body>
    <!-- Custom frameless title bar -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="tb-left" data-tauri-drag-region>
        <span class="tb-logo" data-tauri-drag-region>▌</span>
        <nav id="tabs" role="tablist" aria-label="Terminal tabs"></nav>
        <button id="new-tab" class="tb-icon" title="Нова вкладка (Ctrl+Shift+T)">+</button>
      </div>

      <div class="tb-right">
        <div class="profile-switch">
          <button id="profile-btn" class="tb-icon menu-trigger" type="button" title="Меню" aria-label="Меню" aria-haspopup="menu" aria-controls="profile-menu" aria-expanded="false">
            <span class="menu-glyph" aria-hidden="true"><span></span><span></span><span></span></span>
          </button>
          <ul id="profile-menu" class="hidden"></ul>
        </div>
        <button id="win-min" class="win-btn" title="Згорнути">&#xE921;</button>
        <button id="win-max" class="win-btn" title="Розгорнути">&#xE922;</button>
        <button id="win-close" class="win-btn close" title="Закрити">&#xE8BB;</button>
      </div>
    </header>

    <!-- Terminal panes get mounted here, one per tab -->
    <main id="panes"></main>
    <div id="search-bar" class="search-bar" role="search" hidden>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" />
      <output id="search-count" aria-live="polite"></output>
      <button id="search-prev" type="button">↑</button>
      <button id="search-next" type="button">↓</button>
      <button id="search-close" type="button">×</button>
    </div>
    <div id="error-notices" aria-live="assertive"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
